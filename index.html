<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1, initial-scale=1.0" />
  <title>Suphakit P.</title>

  <link rel="shortcut icon" href="/favicon.png" type="image/x-icon">

  <link rel="stylesheet" href="/src/css/main.css">
</head>

<body>
  <div class="main-container">
    <video src="/src/video/output.webm" loop autoplay muted playsinline></video>
    <pre class="ascii-art" aria-hidden="true"></pre>

    <div class="backdrop hidden hide"></div>

    <div class="container hidden hide">
      <div id="user-container">
        <div id="user-data" class="hidden hide"></div>

        <div id="user-detail" class="hidden hide"></div>
      </div>

      <div class="inner-container hidden hide">
        <div id="user-edu"></div>
        <div id="user-skill"></div>
      </div>
    </div>
  </div>

  <div class="protect"></div>

  <!-- fixed item -->
  <button id="skip-btn" class="skip-btn" type="button" aria-label="Skip animation">Skip</button>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">
    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <script src="/src/js/switcher.js"></script>
  <script src="/src/js/ascii.js"></script>

  <!-- data -->
  <script src="/src/js/data/user.js"></script>
  <script src="/src/js/data/contact.js"></script>
  <script src="/src/js/data/education.js"></script>
  <script src="/src/js/data/skill.js"></script>

  <!-- animation & loader -->
  <script src="/src/js/animation.js"></script>
  <script src="/src/js/loader.js"></script>
</body>

</html>
